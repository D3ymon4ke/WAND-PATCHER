<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#18152e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Wand Body Gradient -->
    <linearGradient id="wandShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Wand Tip / Energy Gradient -->
    <linearGradient id="wandEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerNebula" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Center -->
  <circle cx="310" cy="200" r="160" fill="url(#centerNebula)" />

  <!-- Glowing Rim Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.9" />

  <!-- Inner Subtle Accent Line -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.08" />

  <!-- Cyber Grid / Patch Nodes in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="120" y1="392" x2="180" y2="392" />
    <line x1="180" y1="392" x2="210" y2="362" />
    <circle cx="120" cy="392" r="3" fill="#38bdf8" />
    <circle cx="210" cy="362" r="3" fill="#38bdf8" />

    <line x1="392" y1="120" x2="392" y2="180" />
    <line x1="392" y1="180" x2="362" y2="210" />
    <circle cx="392" cy="120" r="3" fill="#38bdf8" />
    <circle cx="362" cy="210" r="3" fill="#38bdf8" />
  </g>

  <!-- Decorative Orbit Arc -->
  <path d="M 180 180 A 130 130 0 0 1 380 280" fill="none" stroke="url(#wandEnergy)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45" />

  <!-- MAIN MAGIC WAND -->
  <!-- Wand Shaft -->
  <g filter="url(#bloom)">
    <!-- Base Glow Behind Tip -->
    <circle cx="340" cy="172" r="42" fill="#00f2fe" opacity="0.32" />
    <circle cx="340" cy="172" r="22" fill="#c084fc" opacity="0.5" />

    <!-- Wand Handle / Shaft -->
    <path d="M 152 360 L 168 376 C 172 380 178 380 182 376 L 312 246 C 316 242 316 236 312 232 L 296 216 C 292 212 286 212 282 216 L 152 346 C 148 350 148 356 152 360 Z"
          fill="url(#wandShaft)" />

    <!-- Wand Grip Accent Inlays -->
    <path d="M 170 342 L 186 358" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 188 324 L 204 340" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 206 306 L 222 322" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Wand Pommel / Base Gem -->
    <circle cx="152" cy="376" r="8" fill="url(#wandEnergy)" />
    <circle cx="152" cy="376" r="3" fill="#ffffff" />

    <!-- Wand Tip Core Crystal -->
    <polygon points="340,132 356,164 388,172 356,180 340,212 324,180 292,172 324,164"
             fill="url(#wandEnergy)" />

    <!-- Crystal Center Highlight -->
    <circle cx="340" cy="172" r="7" fill="#ffffff" />
  </g>

  <!-- MAGIC BURST STARS / ENERGY PARTICLES -->
  <!-- Primary Star (Top Right) -->
  <g filter="url(#bloom)" transform="translate(390, 120)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4" fill="#00f2fe" />
  </g>

  <!-- Secondary Star (Left of Tip) -->
  <g filter="url(#bloom)" transform="translate(254, 136) scale(0.65)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Tertiary Star (Below Tip) -->
  <g filter="url(#bloom)" transform="translate(388, 230) scale(0.55)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#c084fc" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Small Sparks -->
  <circle cx="316" cy="116" r="3" fill="#ffffff" opacity="0.9" filter="url(#bloom)" />
  <circle cx="424" cy="176" r="3.5" fill="#38bdf8" opacity="0.85" filter="url(#bloom)" />
  <circle cx="360" cy="92" r="2.5" fill="#c084fc" opacity="0.8" />
  <circle cx="282" cy="184" r="2.5" fill="#38bdf8" opacity="0.75" />
  <circle cx="414" cy="208" r="2" fill="#ffffff" opacity="0.7" />
</svg>