<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#1a1833" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Wand Shaft Gradient -->
    <linearGradient id="wandShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Wand Energy Glow Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#ff007a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0" />
    </radialGradient>

    <!-- Tip Radial Glow -->
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Ambient Radiant Nebula -->
  <circle cx="330" cy="180" r="180" fill="url(#ambientGlow)" />

  <!-- Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="7" />

  <!-- Inner Subtle Accent Rim -->
  <rect x="36" y="36" width="440" height="440" rx="100" ry="100" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" />

  <!-- Cyber Grid Circuit Lines (bottom-left & top-right) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round">
    <line x1="100" y1="412" x2="160" y2="412" />
    <line x1="160" y1="412" x2="200" y2="372" />
    <circle cx="100" cy="412" r="4" fill="#38bdf8" fill-opacity="0.4" />
    <circle cx="200" cy="372" r="4" fill="#38bdf8" fill-opacity="0.4" />

    <line x1="412" y1="100" x2="412" y2="160" />
    <line x1="412" y1="160" x2="372" y2="200" />
    <circle cx="412" cy="100" r="4" fill="#38bdf8" fill-opacity="0.4" />
    <circle cx="372" cy="200" r="4" fill="#38bdf8" fill-opacity="0.4" />
  </g>

  <!-- Energy Wave Arc -->
  <path d="M 170 170 A 150 150 0 0 1 390 310" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.5" />

  <!-- Giant Halo Behind Crystal Tip -->
  <circle cx="340" cy="172" r="90" fill="url(#tipGlow)" />
  <circle cx="340" cy="172" r="50" fill="#38bdf8" fill-opacity="0.3" />

  <!-- THE MAGIC WAND -->
  <!-- Wand Handle / Shaft -->
  <path d="M 152 360 L 168 376 C 173 381 180 381 185 376 L 312 249 C 317 244 317 237 312 232 L 296 216 C 291 211 284 211 279 216 L 152 343 C 147 348 147 355 152 360 Z"
        fill="url(#wandShaft)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Cyber Inlay Grips on Handle -->
  <path d="M 172 340 L 188 356" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 192 320 L 208 336" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 212 300 L 228 316" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />

  <!-- Pommel / Base Sphere -->
  <circle cx="152" cy="376" r="10" fill="url(#energyGrad)" stroke="#ffffff" stroke-width="2" />
  <circle cx="150" cy="374" r="3.5" fill="#ffffff" />

  <!-- Collar at the Tip Base -->
  <rect x="296" y="210" width="16" height="24" rx="4" transform="rotate(-45 304 222)" fill="#38bdf8" />

  <!-- CRYSTAL STAR TIP -->
  <!-- Outer Energy Flares -->
  <polygon points="340,116 358,158 400,172 358,186 340,228 322,186 280,172 322,158"
           fill="url(#energyGrad)" />

  <!-- Inner Diamond Core -->
  <polygon points="340,136 353,162 376,172 353,182 340,208 327,182 304,172 327,162"
           fill="#ffffff" />

  <!-- Core White Point -->
  <circle cx="340" cy="172" r="5" fill="#ffffff" />

  <!-- SPARKS & MAGIC STARS -->
  <!-- Top Right Big Star -->
  <g transform="translate(396, 114)">
    <path d="M 0,-26 Q 0,0 26,0 Q 0,0 0,26 Q 0,0 -26,0 Q 0,0 0,-26 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4.5" fill="#00f2fe" />
  </g>

  <!-- Left Star -->
  <g transform="translate(244, 134) scale(0.72)">
    <path d="M 0,-22 Q 0,0 22,0 Q 0,0 0,22 Q 0,0 -22,0 Q 0,0 0,-22 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Bottom-Right Star -->
  <g transform="translate(398, 238) scale(0.6)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#ec4899" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Small Bright Sparkles -->
  <circle cx="316" cy="108" r="4" fill="#ffffff" />
  <circle cx="436" cy="180" r="4" fill="#38bdf8" />
  <circle cx="366" cy="84" r="3" fill="#c084fc" />
  <circle cx="274" cy="192" r="3.5" fill="#38bdf8" />
  <circle cx="424" cy="220" r="3" fill="#ffffff" />
  <circle cx="270" cy="230" r="2.5" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="350" cy="254" r="3" fill="#38bdf8" fill-opacity="0.8" />
</svg>